name: Auto Sync Facebook Post to Portfolio

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-fb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Facebook Scraper
        run: node scripts/sync-fb-post.js

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-fb-post.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto-sync latest Facebook post [skip ci]" && git push)
